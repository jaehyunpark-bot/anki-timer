<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Anki Timer</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
}

.container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
}

#timer {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

button {
    border: none;
    background: transparent;
    color: white;
    font-size: 48px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="container">
    <div id="timer">17</div>
    <button onclick="resetTimer()">↻</button>
</div>

<script>

const START_TIME = 17;

let seconds = START_TIME;
let interval;

const timer = document.getElementById("timer");

function startTimer() {

    clearInterval(interval);

    interval = setInterval(() => {

        if (seconds > 0) {
            seconds--;
            timer.textContent = seconds;
        }

        if (seconds === 0) {
            clearInterval(interval);
        }

    }, 1000);
}

function resetTimer() {

    clearInterval(interval);

    seconds = START_TIME;

    timer.textContent = seconds;

    startTimer();
}

resetTimer();

</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>
</body>
</html>
